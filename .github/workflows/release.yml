name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build + smoke test and upload the zip as an artifact only;
  # the GitHub Release is created for tag pushes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            build/constraints.txt

      # Every build dependency is pinned in build/constraints.txt; unpinned
      # "latest" Nuitka/PySide6 once shipped an exe that crashed on start.
      - name: Install deps
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt zstandard -c build/constraints.txt
          pip check
          python -m nuitka --version

      - name: Cache Nuitka build cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Nuitka/Nuitka/Cache
          key: nuitka-${{ runner.os }}-${{ hashFiles('build/constraints.txt') }}-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ hashFiles('build/constraints.txt') }}-

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: cmd
        run: python scripts\stamp_version.py %GITHUB_REF_NAME%

      - name: Build SayHey main
        shell: cmd
        run: |
          python -m nuitka ^
            --mode=standalone ^
            --windows-console-mode=disable ^
            --output-dir=dist ^
            --output-filename=sayhey ^
            --windows-icon-from-ico=resource\app-icon.ico ^
            --plugin-enable=pyside6 ^
            --include-package=app_core ^
            --include-package=gui ^
            --include-package=core ^
            --include-package=python_protogen ^
            --include-data-dir=resource=resource ^
            --include-data-dir=hotwords=hotwords ^
            --include-module=sounddevice ^
            --include-module=soundcard ^
            --include-package-data=soundcard ^
            --include-package=websockets ^
            --include-module=google.protobuf ^
            --include-module=numpy ^
            --include-module=numpy.core ^
            --follow-imports ^
            --assume-yes-for-downloads ^
            --lto=no ^
            --jobs=4 ^
            main.py

      # Launch the built exe headless and require it to stay alive, so a crash
      # on startup (e.g. a Nuitka segfault) fails the build instead of shipping.
      # Runs from a copy: the app writes settings.json/logs next to the exe.
      - name: Smoke test sayhey.exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sayhey-smoke'
          Copy-Item dist\main.dist $dir -Recurse -Force
          $out = Join-Path $env:RUNNER_TEMP 'smoke_out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'smoke_err.txt'
          $p = Start-Process -FilePath (Join-Path $dir 'sayhey.exe') -WorkingDirectory $dir -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $null = $p.Handle  # keep the handle so ExitCode is readable after exit
          if ($p.WaitForExit(20000)) {
            Get-Content $out, $err -ErrorAction SilentlyContinue
            throw "sayhey.exe exited during startup with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "sayhey.exe still running after 20s: OK"

      - name: Build updater
        shell: cmd
        working-directory: tools/updater
        run: |
          python -m nuitka ^
            --standalone --onefile ^
            --windows-console-mode=disable ^
            --output-filename=updater_app.exe ^
            --output-dir=build_out ^
            updater.py

      - name: Package dist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path dist\sayhey) { Remove-Item -Recurse -Force dist\sayhey }
          Move-Item dist\main.dist dist\sayhey
          Copy-Item tools\updater\build_out\updater_app.exe dist\sayhey\updater_app.exe -Force
          if (Test-Path dist\sayhey-windows.zip) { Remove-Item -Force dist\sayhey-windows.zip }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path dist\sayhey).Path,
            (Join-Path (Resolve-Path dist).Path 'sayhey-windows.zip'),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          Get-Item dist\sayhey-windows.zip | Select-Object FullName, Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayhey-windows
          path: dist/sayhey-windows.zip
          retention-days: 14

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        shell: bash
        run: |
          if [ -s resource/release_log.md ]; then
            echo "path=resource/release_log.md" >> "$GITHUB_OUTPUT"
            echo "gen=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "gen=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sayhey-windows.zip
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.gen }}
          draft: false
          prerelease: false
